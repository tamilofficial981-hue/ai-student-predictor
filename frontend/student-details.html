<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Details</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
    <h1>Student Details</h1>

    <form>
        <input type="text" placeholder="Student Name" required><br><br>

        <input type="number" placeholder="Attendance (%)" required><br><br>

        <input type="number" placeholder="Internal Marks" required><br><br>

        <input type="number" placeholder="Semester GPA" step="0.01" required><br><br>

        <button type="submit">Save Details</button>
    </form>
</div>

</body>
</html>
